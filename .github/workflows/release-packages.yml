name: Release packages
on:
  push:
    paths:
      - .github/workflows/release-packages.yml
permissions:
  contents: write
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build Windows and macOS packages
        run: npm run dist
      - name: Attach packages to v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.zip)
          test "${#files[@]}" -ge 3
          gh release upload v0.1.0 "${files[@]}" --repo "${{ github.repository }}" --clobber
          gh release edit v0.1.0 --repo "${{ github.repository }}" --notes-file .github/v0.1.0.md
