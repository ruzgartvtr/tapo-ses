name: Release packages
on:
  push:
    paths:
      - .github/workflows/release-packages.yml
permissions:
  contents: write
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        env:
          NODE_ENV: development
        run: |
          set -o pipefail
          npm install --include=dev > /tmp/step.log 2>&1 || { echo "::error title=Install::$(tail -n 8 /tmp/step.log | tr '\n' ' ')"; exit 1; }
      - name: Fetch ffmpeg
        run: |
          set -o pipefail
          npm run fetch:ffmpeg > /tmp/step.log 2>&1 || { echo "::error title=Fetch ffmpeg::$(tail -n 8 /tmp/step.log | tr '\n' ' ')"; exit 1; }
      - name: Build app
        run: |
          set -o pipefail
          npm run build > /tmp/step.log 2>&1 || { echo "::error title=Build app::$(tail -n 8 /tmp/step.log | tr '\n' ' ')"; exit 1; }
      - name: Package Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          npx electron-builder --win zip --x64 > /tmp/step.log 2>&1 || { echo "::error title=Package Windows::$(tail -n 12 /tmp/step.log | tr '\n' ' ')"; exit 1; }
      - name: Package macOS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          npx electron-builder --mac zip --x64 --arm64 > /tmp/step.log 2>&1 || { echo "::error title=Package macOS::$(tail -n 12 /tmp/step.log | tr '\n' ' ')"; exit 1; }
      - name: Attach packages to v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.zip)
          test "${#files[@]}" -ge 3
          gh release upload v0.1.0 "${files[@]}" --repo "${{ github.repository }}" --clobber
          gh release edit v0.1.0 --repo "${{ github.repository }}" --notes-file .github/v0.1.0.md
