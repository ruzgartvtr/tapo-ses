name: Release packages
on:
  push:
    paths:
      - .github/workflows/release-packages.yml
permissions:
  contents: write
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        env:
          NODE_ENV: development
        run: npm install --include=dev
      - name: Build Windows and macOS packages
        env:
          NODE_ENV: development
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee /tmp/dist.log
      - name: Attach packages to v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.zip)
          test "${#files[@]}" -ge 3
          gh release upload v0.1.0 "${files[@]}" --repo "${{ github.repository }}" --clobber
          gh release edit v0.1.0 --repo "${{ github.repository }}" --notes-file .github/v0.1.0.md
      - name: Record the build log
        if: failure()
        run: |
          {
            echo '## Build log'
            echo
            echo '```'
            tail -n 120 /tmp/dist.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
