name: Release
on:
  push:
    paths:
      - .github/workflows/release.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 --repo ruzgartvtr/tapo-ses >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.1.0 \
            --repo ruzgartvtr/tapo-ses \
            --target "${{ github.sha }}" \
            --title "Tapo Ses 0.1.0" \
            --notes "$(cat <<'EOF'
Tapo C210 ve aynı konuşma kanalını kullanan Tapo kameraların hoparlöründen ses dosyası çalan Windows ve macOS uygulaması.

- MP3, WAV, M4A ve OGG dosyaları 8 kHz mono PCMA’ya çevrilir.
- Ses, kameranın konuşma kanalına gider (TCP 8800).
- Bilgisayar ile kamera aynı ağda olmalıdır.
- Giriş Tapo bulut şifresiyle yapılır. RTSP şifresi geçersizdir. Şifre yalnız o bilgisayarda durur.
- Kamera listesi, ses kitaplığı ve seviye (0–150) yerelde tutulur.
- Hazır sesler: Zil, Uyarı, Hoş geldin.
- Bir çalma en fazla 90 saniyedir.
- Modeller: C210, C200, C220, C225, C100, C110, C310, C320WS, C500, C510W, D230.

C210 hoparlörü telefon kalitesindedir. Kısa anonslar daha net duyulur.

Kurulum paketleri bu sürüme eklenmedi. Paket, kaynak koddan `npm install` ve `npm run dist` ile çıkar.

- Windows x64: Tapo Ses-0.1.0-win.zip
- macOS Apple silicon: Tapo Ses-0.1.0-arm64-mac.zip
- macOS Intel: Tapo Ses-0.1.0-mac.zip

macOS paketleri imzasızdır.
EOF
)"
