name: Release
on:
  push:
    paths:
      - .github/workflows/release.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.1.0 --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Tapo Ses 0.1.0" --notes-file .github/release-notes.md
